name: "🚀 Build & Test GoogleBooks"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GoogleBooks.sln

      - name: Build
        run: dotnet build GoogleBooks.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GoogleBooks.sln --configuration Release --no-build --verbosity normal
